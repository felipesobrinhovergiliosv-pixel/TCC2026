spring.application.name=projetotcc

spring.datasource.url=jdbc:mysql://localhost:3306/bd_caixa?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# O schema agora é controlado pelo Flyway (db/migration); "update" deixava o Hibernate
# alterar tabelas por fora do histórico de migrations, causando divergência silenciosa.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true

# Chave usada para assinar/validar o JWT. Em produção, defina a variável de ambiente
# JWT_SECRET com um valor forte e secreto (nunca commitar o valor real).
api.security.token.secret=${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao-min-32-chars}